name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (if pushed as a zip instead of raw files)
        run: |
          if [ -f TelegramBoosterApp.zip ]; then
            unzip -o TelegramBoosterApp.zip
            echo "BASE=TelegramBoosterApp" >> "$GITHUB_ENV"
          else
            echo "BASE=." >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: cd "$BASE" && gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.BASE }}/app/build/outputs/apk/debug/app-debug.apk
